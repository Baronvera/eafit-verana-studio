version: "3.9"

services:
  # ── PostgreSQL plataforma ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vas_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: verana_studio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── MinIO (S3 self-hosted) ────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: vas_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis para MCP Bridge (comparte el mismo Redis) ──────
  # El mcp-bridge usa REDIS_URL del mismo Redis de la plataforma

  # ── MinIO bucket init ─────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: vas_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/verana-studio &&
        mc anonymous set download local/verana-studio &&
        echo 'Bucket created.'
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
