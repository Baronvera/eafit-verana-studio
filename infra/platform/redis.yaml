apiVersion: apps/v1
kind: Deployment
metadata:
  name: vas-redis
  namespace: team-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vas-redis
  template:
    metadata:
      labels:
        app: vas-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: vas-redis
  namespace: team-b
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: vas-redis
